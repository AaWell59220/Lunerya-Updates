name: Stage exact LuneryaCrates 0.3.4 replacement
on:
  push:
    branches:
      - staging/crates-034-names-20260929
    paths:
      - scripts/stage-rebuild-crates-034.py
permissions:
  contents: write
jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Get previously published JAR
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          git show origin/gh-pages:files/mods/luneryacrates-0.3.4.jar > /tmp/luneryacrates-old.jar
      - name: Reconstruct and verify EXACT uploaded JAR
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/stage-rebuild-crates-034.py /tmp/luneryacrates-old.jar files/mods/luneryacrates-0.3.4.jar
          echo '9ab07e5a53c6d7d5657d54ddb1aec724f5da13c50d8d7ff0b17cdb3ac9fb1ba2  files/mods/luneryacrates-0.3.4.jar' | sha256sum -c -
      - name: Save verified binary ONLY to staging branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add files/mods/luneryacrates-0.3.4.jar
          git diff --staged --quiet && { echo 'No staged JAR change'; exit 1; }
          git commit -m 'stage: add verified exact LuneryaCrates 0.3.4 with corrected names'
          git push origin HEAD:staging/crates-034-names-20260929
